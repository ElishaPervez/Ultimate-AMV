name: Announce existing release to Discord

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to announce
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    name: Announce existing release
    runs-on: ubuntu-latest
    steps:
      - name: Check out announcement script
        uses: actions/checkout@v4

      - name: Load published release and announce to Discord
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export RELEASE_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.body')"
          export RELEASE_NAME="${TAG}"
          export RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          python .github/scripts/announce_discord.py
